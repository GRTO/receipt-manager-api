name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: receipts
          POSTGRES_PASSWORD: receipts_dev
          POSTGRES_DB: receipt_manager_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U receipts -d receipt_manager_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://receipts:receipts_dev@localhost:5432/receipt_manager_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm run check
