openapi: 3.1.0
info:
  title: Receipt Manager API
  version: 0.1.0
  description: >-
    Personal receipt API with private images and asynchronous local OCR scans.
    Spending summaries remain planned. Amounts are decimal strings with two
    fractional digits, and dates are calendar dates in YYYY-MM-DD form.
servers:
  - url: http://127.0.0.1:3000
security:
  - bearerAuth: []
paths:
  /health:
    get:
      security: []
      summary: Liveness and readiness while the service has no external dependencies
      responses:
        "200":
          description: Service is running
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string, const: ok }
  /v1/me:
    get:
      summary: Return the signed-in user
      responses:
        "200":
          description: User profile
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /v1/categories:
    get:
      summary: List selectable receipt categories
      responses:
        "200":
          description: Categories
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Category" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /v1/receipts:
    get:
      summary: List the signed-in user's receipts
      description: >-
        Results use keyset pagination ordered by the selected field and then id in
        the same direction. A cursor encodes the final item's sort values and is
        bound to the user, filters, and sort order. No ownership parameter exists
        because the first release is personal-only. Search matches merchant and notes.
      parameters:
        - { name: search, in: query, schema: { type: string, maxLength: 200 } }
        - {
            name: month,
            in: query,
            schema: { type: string, pattern: '^\d{4}-(0[1-9]|1[0-2])$' },
          }
        - {
            name: categoryId,
            in: query,
            schema: { type: string, format: uuid },
          }
        - {
            name: limit,
            in: query,
            schema: { type: integer, minimum: 1, maximum: 100, default: 25 },
          }
        - {
            name: sort,
            in: query,
            schema:
              {
                type: string,
                enum: [date_desc, date_asc, total_desc, total_asc],
                default: date_desc,
              },
          }
        - { name: cursor, in: query, schema: { type: string, maxLength: 2048 } }
      responses:
        "200":
          description: Receipt page
          content:
            application/json:
              schema:
                type: object
                required: [items, nextCursor]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Receipt" }
                  nextCursor: { type: [string, "null"] }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      summary: Create a reviewed receipt for the signed-in user
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReceiptInput" }
      responses:
        "201":
          description: Created receipt
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Receipt" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /v1/receipts/{id}:
    parameters:
      - {
          name: id,
          in: path,
          required: true,
          schema: { type: string, format: uuid },
        }
    get:
      summary: Read one owned receipt
      responses:
        "200":
          description: Receipt
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Receipt" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      summary: Update one owned receipt
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReceiptPatch" }
      responses:
        "200":
          description: Updated receipt
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Receipt" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      summary: Delete one owned receipt
      responses:
        "204": { description: Receipt deleted }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /v1/receipts/{id}/image:
    parameters:
      - {
          name: id,
          in: path,
          required: true,
          schema: { type: string, format: uuid },
        }
    put:
      summary: Upload or replace an image on an owned receipt
      description: >-
        The server checks the actual image signature and Content-Type, then stores
        the bytes in a private local directory. Maximum size is 10 MiB. Create
        the receipt first, then upload its image.
      requestBody:
        required: true
        content:
          image/jpeg: { schema: { type: string, format: binary } }
          image/png: { schema: { type: string, format: binary } }
          image/webp: { schema: { type: string, format: binary } }
      responses:
        "200":
          description: Updated receipt
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Receipt" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "413": { $ref: "#/components/responses/ValidationError" }
    get:
      summary: View an image on an owned receipt
      description: Requires a bearer token and returns private, non-cacheable image bytes.
      responses:
        "200":
          description: Image bytes
          content:
            image/jpeg: { schema: { type: string, format: binary } }
            image/png: { schema: { type: string, format: binary } }
            image/webp: { schema: { type: string, format: binary } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /v1/scans:
    post:
      summary: Start a private OCR scan for the signed-in user
      description: >-
        Upload JPEG, PNG, or WebP bytes up to 10 MiB. OCR runs locally in a
        background worker. The image and job expire after 24 hours. OCR never
        creates a receipt; the user must review suggestions and call POST /v1/receipts.
      requestBody:
        required: true
        content:
          image/jpeg: { schema: { type: string, format: binary } }
          image/png: { schema: { type: string, format: binary } }
          image/webp: { schema: { type: string, format: binary } }
      responses:
        "202":
          description: Scan queued
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ScanJob" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "413": { $ref: "#/components/responses/ValidationError" }
  /v1/scans/{id}:
    parameters:
      - {
          name: id,
          in: path,
          required: true,
          schema: { type: string, format: uuid },
        }
    get:
      summary: Read an owned scan job
      responses:
        "200":
          description: Current job status and suggested fields
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ScanJob" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /v1/scans/{id}/retry:
    parameters:
      - {
          name: id,
          in: path,
          required: true,
          schema: { type: string, format: uuid },
        }
    post:
      summary: Retry a failed owned scan once
      responses:
        "202":
          description: Scan queued again
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ScanJob" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/ValidationError" }
  /v1/spending/summary:
    get:
      summary: Monthly totals for the signed-in user's receipts
      description: Each currency has a separate total; currencies are never added together.
      parameters:
        - {
            name: month,
            in: query,
            required: true,
            schema: { type: string, pattern: '^\d{4}-(0[1-9]|1[0-2])$' },
          }
        - {
            name: categoryId,
            in: query,
            schema: { type: string, format: uuid },
          }
        - {
            name: currency,
            in: query,
            schema: { $ref: "#/components/schemas/Currency" },
          }
      responses:
        "200":
          description: Monthly totals grouped by currency and category
          content:
            application/json:
              schema:
                type: object
                required: [month, currencies]
                properties:
                  month: { type: string, pattern: '^\d{4}-(0[1-9]|1[0-2])$' }
                  currencies:
                    type: array
                    items:
                      type: object
                      required: [currency, total, receiptCount, categories]
                      properties:
                        currency: { $ref: "#/components/schemas/Currency" }
                        total: { $ref: "#/components/schemas/Money" }
                        receiptCount: { type: integer, minimum: 0 }
                        categories:
                          type: array
                          items:
                            type: object
                            required: [categoryId, total, receiptCount]
                            properties:
                              categoryId: { type: string, format: uuid }
                              total: { $ref: "#/components/schemas/Money" }
                              receiptCount: { type: integer, minimum: 0 }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Supabase Auth access token verified against the project's asymmetric JWKS.
  schemas:
    Money:
      { type: string, pattern: '^(0|[1-9]\d{0,15})\.\d{2}$', example: "12.50" }
    Currency:
      type: string
      pattern: "^[A-Z]{3}$"
      example: EUR
      description: >-
        Supported ISO 4217 code. EUR is the initial supported currency; the API
        rejects codes not present in the currencies table.
    User:
      type: object
      required: [id, email, preferredCurrency, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        preferredCurrency: { $ref: "#/components/schemas/Currency" }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    Category:
      type: object
      required: [id, slug, name]
      properties:
        id: { type: string, format: uuid }
        slug:
          {
            type: string,
            description: Stable key matching the frontend demo categories,
          }
        name: { type: string }
        color: { type: [string, "null"] }
        icon: { type: [string, "null"] }
    ReceiptInput:
      type: object
      additionalProperties: false
      required: [merchant, purchaseDate, total, currency, categoryId]
      properties:
        merchant: { type: string, minLength: 1, maxLength: 200 }
        purchaseDate: { type: string, format: date }
        total: { $ref: "#/components/schemas/Money" }
        currency: { $ref: "#/components/schemas/Currency" }
        categoryId: { type: string, format: uuid }
        notes: { type: [string, "null"], maxLength: 2000 }
        subtotal:
          { anyOf: [{ $ref: "#/components/schemas/Money" }, { type: "null" }] }
        tax:
          { anyOf: [{ $ref: "#/components/schemas/Money" }, { type: "null" }] }
    ReceiptPatch:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        merchant: { type: string, minLength: 1, maxLength: 200 }
        purchaseDate: { type: string, format: date }
        total: { $ref: "#/components/schemas/Money" }
        currency: { $ref: "#/components/schemas/Currency" }
        categoryId: { type: string, format: uuid }
        notes: { type: [string, "null"], maxLength: 2000 }
        subtotal:
          { anyOf: [{ $ref: "#/components/schemas/Money" }, { type: "null" }] }
        tax:
          { anyOf: [{ $ref: "#/components/schemas/Money" }, { type: "null" }] }
    Receipt:
      type: object
      required:
        [
          id,
          merchant,
          purchaseDate,
          total,
          currency,
          categoryId,
          notes,
          subtotal,
          tax,
          imageUrl,
          createdAt,
          updatedAt,
        ]
      properties:
        id: { type: string, format: uuid }
        merchant: { type: string, minLength: 1, maxLength: 200 }
        purchaseDate: { type: string, format: date }
        total: { $ref: "#/components/schemas/Money" }
        currency: { $ref: "#/components/schemas/Currency" }
        categoryId: { type: string, format: uuid }
        notes: { type: [string, "null"], maxLength: 2000 }
        subtotal:
          { anyOf: [{ $ref: "#/components/schemas/Money" }, { type: "null" }] }
        tax:
          { anyOf: [{ $ref: "#/components/schemas/Money" }, { type: "null" }] }
        imageUrl:
          {
            type: [string, "null"],
            description: Relative authenticated image endpoint when an image exists; send a bearer token to fetch it,
          }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    ScanFields:
      type: object
      additionalProperties: false
      description: Suggestions only; fields may be absent when uncertain.
      properties:
        merchant: { type: string }
        purchaseDate: { type: string, format: date }
        total: { $ref: "#/components/schemas/Money" }
        currency: { $ref: "#/components/schemas/Currency" }
        subtotal: { $ref: "#/components/schemas/Money" }
        tax: { $ref: "#/components/schemas/Money" }
    ScanJob:
      type: object
      required:
        [
          id,
          status,
          fields,
          errorCode,
          attempts,
          createdAt,
          updatedAt,
          expiresAt,
        ]
      properties:
        id: { type: string, format: uuid }
        status: { type: string, enum: [pending, processing, completed, failed] }
        fields:
          anyOf: [{ $ref: "#/components/schemas/ScanFields" }, { type: "null" }]
        errorCode: { type: [string, "null"], enum: [NO_TEXT, OCR_FAILED, null] }
        attempts: { type: integer, minimum: 0, maximum: 2 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
    ApiError:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string, example: VALIDATION_ERROR }
            message: { type: string }
  responses:
    ValidationError:
      description: Invalid input
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiError" }
    Unauthorized:
      description: Missing or invalid access token
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiError" }
    NotFound:
      description: Receipt does not exist or is not owned by this user
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiError" }
